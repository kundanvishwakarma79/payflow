version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: payflow-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - payflow-network

  backend:
    build:
      context: ./backend

    container_name: payflow-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/paytm
      JWT_SECRET: mysecretkey

    depends_on:
      - mongodb

    networks:
      - payflow-network

  frontend:
    build:
      context: ./frontend

    container_name: payflow-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - payflow-network

volumes:
  mongodb_data:

networks:
  payflow-network: